services:
  db:
    image: postgres:18-alpine
    container_name: harbor-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: harbor
      POSTGRES_PASSWORD: harbor
      POSTGRES_DB: harbor_dev
    ports:
      # 5433 on the host so it never fights a locally installed Postgres on 5432.
      - "5433:5432"
    volumes:
      # Postgres 18 images keep PGDATA under /var/lib/postgresql/<major>/docker,
      # so the whole parent directory is the volume.
      - harbor_pgdata:/var/lib/postgresql
      - ./docker/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harbor -d harbor_dev"]
      interval: 3s
      timeout: 3s
      retries: 15

volumes:
  harbor_pgdata:
    name: harbor_pgdata
