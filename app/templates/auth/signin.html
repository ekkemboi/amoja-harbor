{% extends "auth_base.html" %}
{% block title %}Sign in — Amoja Harbor{% endblock %}

{% block content %}
<h1 class="auth-title">Sign in</h1>
<p class="auth-sub">Welcome back to your workspace.</p>

{% if error %}
<div class="alert alert-error" role="alert">
  <p>{{ error }}</p>
</div>
{% endif %}

<form method="post" class="form-grid auth-form">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />

  <div class="field">
    <label class="label" for="email">Email</label>
    <input class="input" id="email" name="email" type="email" required autocomplete="email" value="{{ email }}" />
  </div>

  <div class="field">
    <label class="label" for="password">Password</label>
    <input class="input" id="password" name="password" type="password" required autocomplete="current-password" />
  </div>

  <div class="form-actions">
    <button type="submit" class="btn btn-primary btn-block">Sign in</button>
  </div>
</form>

<p class="auth-footer">
  Need an account?
  <a href="{{ url_for('auth.signup') }}">Create a workspace</a>
</p>
{% endblock %}
