{% extends "base.html" %}
{% block title %}Sign in — Harbor{% endblock %}

{% block content %}
<div class="mx-auto w-full max-w-md px-6 py-16">
  <h1 class="text-2xl font-semibold tracking-tight text-slate-50">Sign in</h1>
  <p class="mt-2 text-sm text-slate-400">Welcome back.</p>

  {% if error %}
  <div class="mt-6 rounded-md border border-red-500/30 bg-red-500/10 px-3 py-2 text-sm text-red-300">
    {{ error }}
  </div>
  {% endif %}

  <form method="post" class="mt-6 space-y-4">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />

    <div>
      <label for="email" class="mb-1.5 block text-xs font-medium text-slate-400">Email</label>
      <input id="email" name="email" type="email" required autocomplete="email" value="{{ email }}"
             class="w-full rounded-md border border-white/10 bg-ink-950 px-3 py-2 text-sm text-slate-100 placeholder:text-slate-600 focus:border-accent-500 focus:outline-none" />
    </div>

    <div>
      <label for="password" class="mb-1.5 block text-xs font-medium text-slate-400">Password</label>
      <input id="password" name="password" type="password" required autocomplete="current-password"
             class="w-full rounded-md border border-white/10 bg-ink-950 px-3 py-2 text-sm text-slate-100 placeholder:text-slate-600 focus:border-accent-500 focus:outline-none" />
    </div>

    <button type="submit" class="w-full rounded-md bg-accent-500 px-4 py-2 text-sm font-medium text-ink-950 transition hover:bg-accent-400">
      Sign in
    </button>
  </form>

  <p class="mt-6 text-sm text-slate-500">
    Need an account?
    <a href="{{ url_for('auth.signup') }}" class="text-accent-400 transition hover:text-accent-300">Create a workspace</a>
  </p>
</div>
{% endblock %}
