<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Harbor{% endblock %}</title>
    <meta name="description" content="Harbor — issue tracking and project workspaces for teams that ship." />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}" />
    <script src="{{ url_for('static', filename='js/htmx.min.js') }}" defer></script>
  </head>
  <body class="flex min-h-full flex-col bg-ink-950 text-slate-300 antialiased">
    <header class="border-b border-white/5">
      <div class="mx-auto flex h-16 w-full max-w-6xl items-center gap-3 px-6">
        <a href="{{ url_for('public.index') }}" class="flex items-center gap-2.5 text-slate-100">
          <span class="grid size-8 place-items-center rounded-lg bg-accent-500/15 ring-1 ring-accent-500/30">
            <svg viewBox="0 0 24 24" fill="none" class="size-4 text-accent-400" aria-hidden="true">
              <path d="M12 3v18M5 8h14M5 16h14" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" />
            </svg>
          </span>
          <span class="text-sm font-semibold tracking-tight">Harbor</span>
        </a>

        <nav class="ml-6 hidden items-center gap-1 sm:flex">
          <a href="#features" class="rounded-md px-3 py-1.5 text-sm text-slate-400 transition hover:bg-white/5 hover:text-slate-100">Features</a>
          <a href="#roadmap" class="rounded-md px-3 py-1.5 text-sm text-slate-400 transition hover:bg-white/5 hover:text-slate-100">Roadmap</a>
          <span class="cursor-not-allowed rounded-md px-3 py-1.5 text-sm text-slate-600" title="Ships in phase 8">API</span>
        </nav>

        <div class="ml-auto flex items-center gap-2">
          <span class="hidden rounded-md border border-white/10 px-2 py-1 text-[11px] font-medium text-slate-500 sm:inline">phase 0</span>
          <a href="#" class="rounded-md bg-white px-3.5 py-1.5 text-sm font-medium text-ink-950 transition hover:bg-slate-200">Sign in</a>
        </div>
      </div>
    </header>

    <main class="flex-1">{% block content %}{% endblock %}</main>

    <footer class="border-t border-white/5">
      <div class="mx-auto flex w-full max-w-6xl flex-col gap-2 px-6 py-8 text-xs text-slate-500 sm:flex-row sm:items-center">
        <p>Harbor — built with Flask, Postgres, and HTMX.</p>
        <p class="sm:ml-auto">
          <a href="{{ url_for('public.healthz') }}" class="transition hover:text-slate-300">Health</a>
        </p>
      </div>
    </footer>
  </body>
</html>
