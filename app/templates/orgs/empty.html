{% extends "auth_base.html" %}
{% block title %}Create a workspace — Amoja Harbor{% endblock %}

{% block content %}
<h1 class="auth-title">Create a workspace</h1>
<p class="auth-sub">You have no workspaces yet. Create one to get started.</p>

<form method="post" action="{{ url_for('start.create') }}" class="form-grid auth-form">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />

  <div class="field">
    <label class="label" for="name">Workspace name</label>
    <input class="input" id="name" name="name" type="text" required minlength="2" />
    <p class="hint">Becomes your address, e.g. /app/acme.</p>
  </div>

  <div class="form-actions">
    <button type="submit" class="btn btn-primary btn-block">Create workspace</button>
  </div>
</form>

<p class="auth-footer">
  <a href="{{ url_for('public.index') }}">Back to the landing page</a>
</p>
{% endblock %}
