<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Amoja Harbor{% endblock %}</title>
    <meta name="description" content="Amoja Harbor — issue tracking and project workspaces for teams that ship." />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}" />
    {% block head %}{% endblock %}
  </head>
  <body class="auth-body">
    <main class="auth-page">
      <div class="auth-shell">
        <a class="auth-brand brand-lockup" href="{{ url_for('public.index') }}">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <path d="M12 22V8" />
              <path d="M5 12H2a10 10 0 0 0 20 0h-3" />
              <circle cx="12" cy="5" r="3" />
            </svg>
          </span>
          <span class="brand-copy">
            <span class="brand-name">Amoja Harbor</span>
            <span class="brand-sub">Issue tracking</span>
          </span>
        </a>

        <div class="auth-card">{% block content %}{% endblock %}</div>

        <p class="auth-footnote">Amoja Harbor 0.1 &middot; Flask + SQLite + HTMX</p>
      </div>
    </main>
  </body>
</html>
